<svg xmlns="http://www.w3.org/2000/svg" width="390" height="920" viewBox="0 0 390 920"><title>Account and integrations: proposed dark mobile wireframe</title><rect x="0" y="0" width="390" height="920" rx="0" fill="#11151C" stroke="#11151C"/><rect x="0" y="0" width="390" height="64" rx="0" fill="#191F28" stroke="#35404D"/><text x="24" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#EEF2F7">Career Hub</text><text x="315" y="39" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Menu</text><text x="20" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#ADBACB">Career Hub / Profile</text><text x="20" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#EEF2F7">Account and integrations</text><text x="20" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Privacy, theme and connected AI assistants.</text><rect x="20" y="211" width="350" height="40" rx="6" fill="#AEC7ED" stroke="#AEC7ED"/><text x="32" y="236" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#14181F">Account menu</text><rect x="20" y="279" width="350" height="168" rx="8" fill="#191F28" stroke="#35404D"/><text x="40" y="310" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Appearance</text><text x="40" y="339" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">System / Light / Dark. Same layout,</text><text x="40" y="360" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">typography and semantic meanings in both</text><text x="40" y="381" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">themes.</text><rect x="40" y="391" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="52" y="416" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Choose theme</text><rect x="20" y="467" width="350" height="162" rx="8" fill="#191F28" stroke="#35404D"/><text x="40" y="498" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Account and privacy</text><text x="40" y="527" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Session management, data export and</text><text x="40" y="548" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">deletion remain available with</text><text x="40" y="569" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">appropriate confirmation.</text><rect x="40" y="573" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="52" y="598" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Privacy controls</text><rect x="20" y="649" width="350" height="162" rx="8" fill="#191F28" stroke="#35404D"/><text x="40" y="680" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">AI integrations</text><text x="40" y="709" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Advanced MCP connection and token scopes</text><text x="40" y="730" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">remain inspectable. Keys never appear in</text><text x="40" y="751" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">the candidate editor.</text><rect x="40" y="755" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="52" y="780" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Manage integrations</text><rect x="0" y="846" width="390" height="74" rx="0" fill="#191F28" stroke="#35404D"/><text x="12.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#ADBACB">Overview</text><text x="90.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#AEC7ED">Profile</text><text x="168.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#ADBACB">Jobs</text><text x="246.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#ADBACB">Resumes</text><text x="324.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#ADBACB">Applications</text><text x="20" y="830" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#ADBACB">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>