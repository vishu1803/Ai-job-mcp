<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Resumes: proposed light desktop wireframe</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F6F8" stroke="#F5F6F8"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#FFFFFF" stroke="#D4DAE3"/><text x="48" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#18212E">Career Hub</text><text x="330" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Overview</text><text x="475" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Profile</text><text x="620" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Jobs</text><rect x="753" y="17" width="128" height="32" rx="6" fill="#EEF1F5" stroke="#EEF1F5"/><text x="765" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#315B93">Resumes</text><text x="910" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Applications</text><text x="1240" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#536276">Help     Account</text><text x="144" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#536276">Career Hub / Resumes</text><text x="144" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="650" fill="#18212E">Resumes</text><text x="144" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Masters, tailored drafts and approved versions.</text><rect x="1126" y="120" width="170" height="40" rx="6" fill="#315B93" stroke="#315B93"/><text x="1138" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Create resume</text><text x="144" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">All    Masters    Drafts    Approved</text><rect x="144" y="244" width="740" height="158" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="275" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Tailored draft / Frontend Engineer</text><text x="164" y="304" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Synthetic Systems / saved draft. Resume the authoritative current revision.</text><rect x="164" y="346" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="371" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Continue editing</text><rect x="144" y="422" width="740" height="158" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="453" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Master resume / version 1</text><text x="164" y="482" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Candidate-reviewed source. Draft edits do not alter this master.</text><rect x="164" y="524" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="549" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Tailor for a job</text><rect x="144" y="600" width="740" height="144" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="631" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Imported documents</text><text x="164" y="660" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Review, download and recover source versions in the same library.</text><rect x="164" y="688" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="713" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Import master</text><rect x="912" y="244" width="384" height="175" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="932" y="275" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Resume creation</text><text x="932" y="304" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Choose a master and a target job.</text><text x="932" y="325" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Blank/untargeted creation is not currently</text><text x="932" y="346" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">supported.</text><text x="144" y="984" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#536276">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>