<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Review wording: proposed light desktop wireframe</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F6F8" stroke="#F5F6F8"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#FFFFFF" stroke="#D4DAE3"/><text x="48" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#18212E">Career Hub</text><text x="330" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Overview</text><text x="475" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Profile</text><text x="620" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Jobs</text><rect x="753" y="17" width="128" height="32" rx="6" fill="#EEF1F5" stroke="#EEF1F5"/><text x="765" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#315B93">Resumes</text><text x="910" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Applications</text><text x="1240" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#536276">Help     Account</text><text x="144" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#536276">Resumes / Studio</text><text x="144" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="650" fill="#18212E">Review wording</text><text x="144" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Source-preserving suggestions. You make the decision.</text><rect x="1126" y="120" width="170" height="40" rx="6" fill="#315B93" stroke="#315B93"/><text x="1138" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Keep editing</text><rect x="144" y="212" width="740" height="116" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Candidate review</text><text x="164" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Original master v1 / Candidate-reported source. New facts and unsupported metrics are refused.</text><rect x="144" y="348" width="740" height="282" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="384" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Original</text><text x="164" y="416" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#18212E">Implemented React views with the use of component interfaces in order to support internal</text><text x="164" y="437" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#18212E">workflows.</text><text x="164" y="488" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#176A49">Proposed wording</text><text x="164" y="520" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#18212E">Implemented React views with component interfaces to support internal workflows.</text><rect x="144" y="652" width="152" height="40" rx="6" fill="#315B93" stroke="#315B93"/><text x="156" y="677" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Accept wording</text><rect x="314" y="652" width="130" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="326" y="677" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Reject</text><rect x="144" y="714" width="740" height="98" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="745" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">If the draft changes</text><text x="164" y="774" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Stale suggestions cannot apply. Re-evaluate from the latest saved wording.</text><rect x="912" y="212" width="384" height="200" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="932" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Supporting source</text><text x="932" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Inspect exact candidate-authored source text</text><text x="932" y="293" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">and truth class. No broad AI quality claim.</text><rect x="932" y="356" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="944" y="381" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Inspect evidence</text><text x="144" y="984" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#536276">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>