" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Target job</text><text x="164" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Title, company, source URL and description retained together. Confirm imported requirements.</text><rect x="164" y="322" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="347" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">View description</text><rect x="144" y="398" width="740" height="185" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="429" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Requirements</text><text x="164" y="458" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">React / candidate-reported. PostgreSQL / candidate-reported. Related terms do not satisfy</text><text x="164" y="479" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">strict requirements.</text><rect x="164" y="527" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="552" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Inspect coverage</text><rect x="144" y="603" width="740" height="142" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="634" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Resume for this job</text><text x="164" y="663" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Choose your master once, then reopen the same tailored draft.</text><rect x="164" y="689" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="714" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Choose master</