<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Career profile: proposed light desktop wireframe</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F6F8" stroke="#F5F6F8"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#FFFFFF" stroke="#D4DAE3"/><text x="48" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#18212E">Career Hub</text><text x="330" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Overview</text><rect x="463" y="17" width="128" height="32" rx="6" fill="#EEF1F5" stroke="#EEF1F5"/><text x="475" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#315B93">Profile</text><text x="620" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Jobs</text><text x="765" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Resumes</text><text x="910" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Applications</text><text x="1240" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#536276">Help     Account</text><text x="144" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#536276">Career Hub / Profile</text><text x="144" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="650" fill="#18212E">Career profile</text><text x="144" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Your facts, preferences and evidence in one place.</text><rect x="1126" y="120" width="170" height="40" rx="6" fill="#315B93" stroke="#315B93"/><text x="1138" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Edit profile</text><text x="144" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#536276">Facts   Skills and projects   Sources</text><rect x="144" y="242" width="740" height="174" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="273" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Professional identity</text><text x="164" y="302" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Asha / saved contact and career narrative. Master source version remains inspectable.</text><rect x="164" y="360" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="385" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Edit facts</text><rect x="144" y="434" width="740" height="170" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="465" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Skills and projects</text><text x="164" y="494" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Candidate-reported skills and corroborated evidence use different labels.</text><rect x="164" y="548" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="573" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Inspect evidence</text><rect x="144" y="622" width="740" height="142" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="653" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Job preferences</text><text x="164" y="682" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Roles, workplace and screening preferences are separate from resume claims.</text><rect x="164" y="708" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="733" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Review preferences</text><rect x="912" y="242" width="384" height="150" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="932" y="273" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Profile checklist</text><text x="932" y="302" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Show the exact missing fields rather than</text><text x="932" y="323" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">competing readiness percentages.</text><text x="144" y="984" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#536276">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>