<svg xmlns="http://www.w3.org/2000/svg" width="390" height="920" viewBox="0 0 390 920"><title>Sources and evidence: proposed light mobile wireframe</title><rect x="0" y="0" width="390" height="920" rx="0" fill="#F5F6F8" stroke="#F5F6F8"/><rect x="0" y="0" width="390" height="64" rx="0" fill="#FFFFFF" stroke="#D4DAE3"/><text x="24" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#18212E">Career Hub</text><text x="315" y="39" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Menu</text><text x="20" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#536276">Career Hub / Profile</text><text x="20" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#18212E">Sources and evidence</text><text x="20" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Review your master source and connected</text><text x="20" y="191" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">resources.</text><rect x="20" y="211" width="350" height="40" rx="6" fill="#315B93" stroke="#315B93"/><text x="32" y="236" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Connect source</text><rect x="20" y="279" width="350" height="164" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="40" y="310" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Master resume / version 1</text><text x="40" y="339" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Original upload preserved. Parsed facts</text><text x="40" y="360" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">require candidate review.</text><rect x="40" y="387" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="52" y="412" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Review source</text><rect x="20" y="463" width="350" height="172" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="40" y="494" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">GitHub / not connected</text><text x="40" y="523" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Repository scope and revocation remain</text><text x="40" y="544" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">explicit. Linking a URL does not verify a</text><text x="40" y="565" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">qualification.</text><rect x="40" y="579" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="52" y="604" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Connect GitHub</text><rect x="20" y="655" width="350" height="150" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="40" y="686" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Evidence inventory</text><text x="40" y="715" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Inspect file, commit or candidate-source</text><text x="40" y="736" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">provenance without changing its truth</text><text x="40" y="757" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">classification.</text><rect x="0" y="846" width="390" height="74" rx="0" fill="#FFFFFF" stroke="#D4DAE3"/><text x="12.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#536276">Overview</text><text x="90.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#315B93">Profile</text><text x="168