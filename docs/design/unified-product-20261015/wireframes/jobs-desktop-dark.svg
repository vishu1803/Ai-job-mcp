<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Jobs: proposed dark desktop wireframe</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#11151C" stroke="#11151C"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#191F28" stroke="#35404D"/><text x="48" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#EEF2F7">Career Hub</text><text x="330" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Overview</text><text x="475" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Profile</text><rect x="608" y="17" width="128" height="32" rx="6" fill="#232B36" stroke="#232B36"/><text x="620" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#AEC7ED">Jobs</text><text x="765" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Resumes</text><text x="910" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Applications</text><text x="1240" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#ADBACB">Help     Account</text><text x="144" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#ADBACB">Career Hub / Jobs</text><text x="144" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="650" fill="#EEF2F7">Jobs</text><text x="144" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Discover, save or bring a job description.</text><rect x="1126" y="120" width="170" height="40" rx="6" fill="#AEC7ED" stroke="#AEC7ED"/><text x="1138" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#14181F">Analyze a job</text><text x="144" y="222" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Discover    Saved    Analyze a description</text><text x="144" y="254" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#ADBACB">Role or keywords</text><rect x="144" y="266" width="740" height="44" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="156" y="294" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#EEF2F7">Frontend Engineer</text><rect x="144" y="344" width="740" height="170" rx="8" fill="#191F28" stroke="#35404D"/><text x="164" y="375" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Bring a job description</text><text x="164" y="404" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Use one shared targeting flow. Provider unavailable, no results and filtered-out results are</text><text x="164" y="425" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">distinct.</text><rect x="164" y="458" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="176" y="483" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Paste description</text><rect x="144" y="534" width="740" height="168" rx="8" fill="#191F28" stroke="#35404D"/><text x="164" y="565" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Saved target / example</text><text x="164" y="594" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Frontend Engineer / Synthetic Systems. Open requirements or tailor from the same target.</text><rect x="164" y="646" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="176" y="671" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">View job</text><rect x="912" y="344" width="384" height="170" rx="8" fill="#191F28" stroke="#35404D"/><text x="932" y="375" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Match explanation</text><text x="932" y="404" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Exact, equivalent, related and missing matches</text><text x="932" y="425" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">remain distinct. No employer ATS score claim.</text><text x="144" y="984" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#ADBACB">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>