<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Sources and evidence: proposed light desktop wireframe</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F6F8" stroke="#F5F6F8"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#FFFFFF" stroke="#D4DAE3"/><text x="48" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#18212E">Career Hub</text><text x="330" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Overview</text><rect x="463" y="17" width="128" height="32" rx="6" fill="#EEF1F5" stroke="#EEF1F5"/><text x="475" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#315B93">Profile</text><text x="620" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Jobs</text><text x="765" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Resumes</text><text x="910" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Applications</text><text x="1240" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#536276">Help     Account</text><text x="144" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#536276">Career Hub / Profile</text><text x="144" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="650" fill="#18212E">Sources and evidence</text><text x="144" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Review your master source and connected resources.</text><rect x="1126" y="120" width="170" height="40" rx="6" fill="#315B93" stroke="#315B93"/><text x="1138" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Connect source</text><rect x="144" y="212" width="740" height="164" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Master resume / version 1</text><text x="164" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Original upload preserved. Parsed facts require candidate review.</text><rect x="164" y="320" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="345" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Review source</text><rect x="144" y="396" width="740" height="172" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="427" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">GitHub / not connected</text><text x="164" y="456" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Repository scope and revocation remain explicit. Linking a URL does not verify a</text><text x="164" y="477" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">qualification.</text><rect x="164" y="512" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="537" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Connect GitHub</text><rect x="144" y="588" width="740" height="150" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="619" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Evidence inventory</text><text x="164" y="648" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Inspect file, commit or candidate-source provenance without changing its truth classification.</text><rect x="912" y="212" width="384" height="164" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="932" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Data ownership</text><text x="932" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">You control the connected resources.</text><text x="932" y="293" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Encryption and tenant boundaries remain</text><text x="932" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">unchanged.</text><text x="144" y="984" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#536276">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>