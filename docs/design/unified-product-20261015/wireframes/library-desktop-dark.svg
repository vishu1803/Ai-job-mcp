ter</text><rect x="912" y="244" width="384" height="175" rx="8" fill="#191F28" stroke="#35404D"/><text x="932" y="275" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Resume creation</text><text x="932" y="304" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Choose a master and a target job.</text><text x="932" y="325" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Blank/untargeted creation is not currently</text><text x="932" y="346" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">supported.</text><text x="144" y="984" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#ADBACB">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>