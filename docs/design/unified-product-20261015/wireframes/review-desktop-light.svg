<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Application review: proposed light desktop wireframe</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F6F8" stroke="#F5F6F8"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#FFFFFF" stroke="#D4DAE3"/><text x="48" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#18212E">Career Hub</text><text x="330" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Overview</text><text x="475" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Profile</text><text x="620" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Jobs</text><text x="765" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Resumes</text><rect x="898" y="17" width="128" height="32" rx="6" fill="#EEF1F5" stroke="#EEF1F5"/><text x="910" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#315B93">Applications</text><text x="1240" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#536276">Help     Account</text><text x="144" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#536276">Career Hub / Applications</text><text x="144" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="650" fill="#18212E">Application review</text><text x="144" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Confirm this version and the job-specific answers.</text><rect x="1126" y="120" width="170" height="40" rx="6" fill="#315B93" stroke="#315B93"/><text x="1138" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Review approval</text><rect x="144" y="212" width="740" height="156" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Job and selected resume</text><text x="164" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Frontend Engineer / Synthetic Systems. Show the exact draft revision, document and package</text><text x="164" y="293" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">binding.</text><rect x="164" y="312" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="337" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Open Studio</text><rect x="144" y="388" width="740" height="178" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="419" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Application-specific questions</text><text x="164" y="448" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Reuse profile facts. Ask only for missing answers or conflicting values. These answers do not</text><text x="164" y="469" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">rewrite the master.</text><rect x="164" y="510" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="535" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Review answers</text><rect x="144" y="586" width="740" height="180" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="617" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Review and approve</text><text x="164" y="646" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Explicit consent binds the exact package and destination. Any later edit needs a fresh review.</text><rect x="164" y="710" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="735" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Review package</text><rect x="912" y="212" width="384" height="170" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="932" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Content checks</text><text x="932" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">One measured A4 page / selected text</text><text x="932" y="293" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">preserved. DOCX viewer checks are separate. No</text><text x="932" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">ATS compatibility guarantee.</text><text x="144" y="984" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#536276">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>