<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Application review: proposed dark desktop wireframe</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#11151C" stroke="#11151C"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#191F28" stroke="#35404D"/><text x="48" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#EEF2F7">Career Hub</text><text x="330" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Overview</text><text x="475" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Profile</text><text x="620" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Jobs</text><text x="765" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Resumes</text><rect x="898" y="17" width="128" height="32" rx="6" fill="#232B36" stroke="#232B36"/><text x="910" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#AEC7ED">Applications</text><text x="1240" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#ADBACB">Help     Account</text><text x="144" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#ADBACB">Career Hub / Applications</text><text x="144" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="650" fill="#EEF2F7">Application review</text><text x="144" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Confirm this version and the job-specific answers.</text><rect x="1126" y="120" width="170" height="40" rx="6" fill="#AEC7ED" stroke="#AEC7ED"/><text x="1138" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#14181F">Review approval</text><rect x="144" y="212" width="740" height="156" rx="8" fill="#191F28" stroke="#35404D"/><text x="164" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Job and selected resume</text><text x="164" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Frontend Engineer / Synthetic Systems. Show the exact draft revision, document and package</text><text x="164" y="293" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">binding.</text><rect x="164" y="312" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="176" y="337" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Open Studio</text><rect x="144" y="388" width="740" height="178" rx="8" fill="#191F28" stroke="#35404D"/><text x="164" y="419" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Application-specific questions</text><text x="164" y="448" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Reuse profile facts. Ask only for missing answers or conflicting values. These answers do not</text><text x="164" y="469" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">rewrite the master.</text><rect x="164" y="510" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="176" y="535" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Review answers</text><rect x="144" y="586" width="740" height="180" rx="8" fill="#191F28" stroke="#35404D"/><text x="164" y="617" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Review and approve</text><text x="164" y="646" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Explicit consent binds the exact package and destination. Any later edit needs a fresh review.</text><rect x="164" y="710" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="176" y="735" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Review package</text><rect x="912" y="212" width="384" height="170" rx="8" fill="#191F28" stroke="#35404D"/><text x="932" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Content checks</text><text x="932" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">One measured A4 page / selected text</text><text x="932" y="293" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">preserved. DOCX viewer checks are separate. No</text><text x="932" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">ATS compatibility guarantee.</text><text x="144" y="984" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#ADBACB">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>