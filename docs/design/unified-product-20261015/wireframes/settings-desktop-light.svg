<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Account and integrations: proposed light desktop wireframe</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F6F8" stroke="#F5F6F8"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#FFFFFF" stroke="#D4DAE3"/><text x="48" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#18212E">Career Hub</text><text x="330" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Overview</text><rect x="463" y="17" width="128" height="32" rx="6" fill="#EEF1F5" stroke="#EEF1F5"/><text x="475" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#315B93">Profile</text><text x="620" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Jobs</text><text x="765" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Resumes</text><text x="910" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Applications</text><text x="1240" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#536276">Help     Account</text><text x="144" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#536276">Career Hub / Profile</text><text x="144" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="650" fill="#18212E">Account and integrations</text><text x="144" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Privacy, theme and connected AI assistants.</text><rect x="1126" y="120" width="170" height="40" rx="6" fill="#315B93" stroke="#315B93"/><text x="1138" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Account menu</text><rect x="144" y="212" width="740" height="168" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Appearance</text><text x="164" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">System / Light / Dark. Same layout, typography and semantic meanings in both themes.</text><rect x="164" y="324" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="349" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Choose theme</text><rect x="144" y="400" width="740" height="162" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="431" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Account and privacy</text><text x="164" y="460" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Session management, data export and deletion remain available with appropriate confirmation.</text><rect x="164" y="506" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="531" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Privacy controls</text><rect x="144" y="582" width="740" height="162" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="613" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">AI integrations</text><text x="164" y="642" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Advanced MCP connection and token scopes remain inspectable. Keys never appear in the</text><text x="164" y="663" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">candidate editor.</text><rect x="164" y="688" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="713" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Manage integrations</text><rect x="912" y="212" width="384" height="168" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="932" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Optional assistance</text><text x="932" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Keep contextual help available without</text><text x="932" y="293" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">repeating a second global AI action on every</text><text x="932" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">page.</text><text x="144" y="984" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#536276">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>