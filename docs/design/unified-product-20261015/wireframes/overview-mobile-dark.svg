<svg xmlns="http://www.w3.org/2000/svg" width="390" height="920" viewBox="0 0 390 920"><title>Overview: proposed dark mobile wireframe</title><rect x="0" y="0" width="390" height="920" rx="0" fill="#11151C" stroke="#11151C"/><rect x="0" y="0" width="390" height="64" rx="0" fill="#191F28" stroke="#35404D"/><text x="24" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#EEF2F7">Career Hub</text><text x="315" y="39" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Menu</text><text x="20" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#ADBACB">Career Hub / Overview</text><text x="20" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#EEF2F7">Overview</text><text x="20" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Pick up where you left off.</text><rect x="20" y="211" width="350" height="40" rx="6" fill="#AEC7ED" stroke="#AEC7ED"/><text x="32" y="236" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#14181F">Find a job</text><rect x="20" y="279" width="350" height="170" rx="8" fill="#191F28" stroke="#35404D"/><text x="40" y="310" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Continue your resume</text><text x="40" y="339" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Frontend Engineer / Synthetic Systems.</text><text x="40" y="360" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Saved wording and selected content are</text><text x="40" y="381" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">retained.</text><rect x="40" y="393" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="52" y="418" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Continue draft</text><rect x="20" y="469" width="350" height="142" rx="8" fill="#191F28" stroke="#35404D"/><text x="40" y="500" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Next step</text><text x="40" y="529" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Review five unanswered screening</text><text x="40" y="550" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">preferences when they are relevant to a</text><text x="40" y="571" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">job.</text><rect x="40" y="555" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="52" y="580" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Review profile</text><rect x="20" y="633" width="350" height="150" rx="8" fill="#191F28" stroke="#35404D"/><text x="40" y="664" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Saved jobs</text><text x="40" y="693" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Your saved targets appear here. Bring a</text><text x="40" y="714" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">description if discovery is unavailable.</text><rect x="40" y="727" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="52" y="752" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Browse jobs</text><rect x="0" y="846" width="390" height="74" rx="0" fill="#191F28" stroke="#35404D"/><text x="12.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#AEC7ED">Overview</text><text x="90.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#ADBACB">Profile</text><