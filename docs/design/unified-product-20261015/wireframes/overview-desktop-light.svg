<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Overview: proposed light desktop wireframe</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F6F8" stroke="#F5F6F8"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#FFFFFF" stroke="#D4DAE3"/><text x="48" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#18212E">Career Hub</text><rect x="318" y="17" width="128" height="32" rx="6" fill="#EEF1F5" stroke="#EEF1F5"/><text x="330" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#315B93">Overview</text><text x="475" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Profile</text><text x="620" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Jobs</text><text x="765" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Resumes</text><text x="910" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Applications</text><text x="1240" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#536276">Help     Account</text><text x="144" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#536276">Career Hub / Overview</text><text x="144" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="650" fill="#18212E">Overview</text><text x="144" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Pick up where you left off.</text><rect x="1126" y="120" width="170" height="40" rx="6" fill="#315B93" stroke="#315B93"/><text x="1138" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Find a job</text><rect x="144" y="212" width="740" height="170" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Continue your resume</text><text x="164" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Frontend Engineer / Synthetic Systems. Saved wording and selected content are retained.</text><rect x="164" y="326" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="351" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Continue draft</text><rect x="144" y="402" width="740" height="142" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="433" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Next step</text><text x="164" y="462" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Review five unanswered screening preferences when they are relevant to a job.</text><rect x="164" y="488" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="513" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Review profile</text><rect x="144" y="566" width="740" height="150" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="597" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Saved jobs</text><text x="164" y="626" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Your saved targets appear here. Bring a description if discovery is unavailable.</text><rect x="164" y="660" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="685" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Browse jobs</text><rect x="912" y="212" width="384" height="215" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="932" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Sources</text><text x="932" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Master resume v1 / Candidate-reported. Connect</text><text x="932" y="293" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">evidence when you choose.</text><rect x="932" y="371" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="944" y="396" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Inspect source</text><text x="144" y="984" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#536276">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>