<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Application handoff: proposed dark desktop wireframe</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#11151C" stroke="#11151C"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#191F28" stroke="#35404D"/><text x="48" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#EEF2F7">Career Hub</text><text x="330" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Overview</text><text x="475" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Profile</text><text x="620" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Jobs</text><text x="765" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Resumes</text><rect x="898" y="17" width="128" height="32" rx="6" fill="#232B36" stroke="#232B36"/><text x="910" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#AEC7ED">Applications</text><text x="1240" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#ADBACB">Help     Account</text><text x="144" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#ADBACB">Career Hub / Applications</text><text x="144" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="650" fill="#EEF2F7">Application handoff</text><text x="144" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Use the exact reviewed package. Submission is separate.</text><rect x="1126" y="120" width="170" height="40" rx="6" fill="#AEC7ED" stroke="#AEC7ED"/><text x="1138" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#14181F">Download package</text><rect x="144" y="212" width="740" height="152" rx="8" fill="#191F28" stroke="#35404D"/><text x="164" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Reviewed package / example state</text><text x="164" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Inspect exact document versions and approval status. Preparing a kit does not submit an</text><text x="164" y="293" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">application.</text><rect x="164" y="308" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="176" y="333" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Preview resume</text><rect x="144" y="384" width="740" height="158" rx="8" fill="#191F28" stroke="#35404D"/><text x="164" y="415" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Downloads</text><text x="164" y="444" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">PDF, native DOCX and other supported package artifacts use their own verified bindings.</text><rect x="164" y="486" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="176" y="511" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Download PDF</text><rect x="144" y="562" width="740" height="185" rx="8" fill="#191F28" stroke="#35404D"/><text x="164" y="593" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Next step</text><text x="164" y="622" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Open the destination or use the authorized adapter. Submission needs a separate explicit</text><text x="164" y="643" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">action and receipt.</text><rect x="164" y="691" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="176" y="716" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Open destination</text><rect x="912" y="212" width="384" height="202" rx="8" fill="#191F28" stroke="#35404D"/><text x="932" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Version history</text><text x="932" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Old approved packages are immutable. Restoring</text><text x="932" y="293" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">draft content creates a new editable revision.</text><rect x="932" y="358" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="944" y="383" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Inspect history</text><text x="144" y="984" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#ADBACB">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>