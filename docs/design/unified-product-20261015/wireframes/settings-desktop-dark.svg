<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Account and integrations: proposed dark desktop wireframe</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#11151C" stroke="#11151C"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#191F28" stroke="#35404D"/><text x="48" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#EEF2F7">Career Hub</text><text x="330" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Overview</text><rect x="463" y="17" width="128" height="32" rx="6" fill="#232B36" stroke="#232B36"/><text x="475" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#AEC7ED">Profile</text><text x="620" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Jobs</text><text x="765" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Resumes</text><text x="910" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Applications</text><text x="1240" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#ADBACB">Help     Account</text><text x="144" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#ADBACB">Career Hub / Profile</text><text x="144" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="650" fill="#EEF2F7">Account and integrations</text><text x="144" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Privacy, theme and connected AI assistants.</text><rect x="1126" y="120" width="170" height="40" rx="6" fill="#AEC7ED" stroke="#AEC7ED"/><text x="1138" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#14181F">Account menu</text><rect x="144" y="212" width="740" height="168" rx="8" fill="#191F28" stroke="#35404D"/><text x="164" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Appearance</text><text x="164" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">System / Light / Dark. Same layout, typography and semantic meanings in both themes.</text><rect x="164" y="324" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="176" y="349" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Choose theme</text><rect x="144" y="400" width="740" height="162" rx="8" fill="#191F28" stroke="#35404D"/><text x="164" y="431" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Account and privacy</text><text x="164" y="460" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Session management, data export and deletion remain available with appropriate confirmation.</text><rect x="164" y="506" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="176" y="531" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Privacy controls</text><rect x="144" y="582" width="740" height="162" rx="8" fill="#191F28" stroke="#35404D"/><text x="164" y="613" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">AI integrations</text><text x="164" y="642" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Advanced MCP connection and token scopes remain inspectable. Keys never appear in the</text><text x="164" y="663" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">candidate editor.</text><rect x="164" y="688" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="176" y="713" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Manage integrations</text><rect x="912" y="212" width="384" height="168" rx="8" fill="#191F28" stroke="#35404D"/><text x="932" y="243" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Optional assistance</text><text x="932" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Keep contextual help available without</text><text x="932" y="293" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">repeating a second global AI action on every</text><text x="932" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">page.</text><text x="144" y="984" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#ADBACB">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>