"14" font-weight="400" fill="#536276">Discover    Saved    Analyze a description</text><text x="144" y="254" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#536276">Role or keywords</text><rect x="144" y="266" width="740" height="44" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="156" y="294" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#18212E">Frontend Engineer</text><rect x="144" y="344" width="740" height="170" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="375" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Bring a job description</text><text x="164" y="404" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Use one shared targeting flow. Provider unavailable, no results and filtered-out results are</text><text x="164" y="425" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">distinct.</text><rect x="164" y="458" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="483" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Paste description</text><rect x="144" y="534" width="740" height="168" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="164" y="565" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Saved target / example</text><text x="164" y="594" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Frontend Engineer / Synthetic Systems. Open requirements or tailor from the same target.</text><rect x="164" y="646" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="176" y="671" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">View job</text><rect x="912" y="344" width="384" height="170" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="932" y="375" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Match explanation</text><text x="932" y="404" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Exact, equivalent, related and missing matches</text><text x="932" y="425" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">remain distinct. No employer ATS score claim.</text><text x="144" y="984" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#536276">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>