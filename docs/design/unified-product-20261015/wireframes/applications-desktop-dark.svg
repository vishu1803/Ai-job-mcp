s-serif" font-size="13" font-weight="400" fill="#ADBACB">Preparing    Submitted    Interviews    Closed</text><rect x="144" y="244" width="740" height="170" rx="8" fill="#191F28" stroke="#35404D"/><text x="164" y="275" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Frontend Engineer / example preparation</text><text x="164" y="304" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Synthetic Systems / linked tailored draft. Status is Preparing until actual submission is</text><text x="164" y="325" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">recorded.</text><rect x="164" y="358" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="176" y="383" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Continue review</text><rect x="144" y="434" width="740" height="145" rx="8" fill="#191F28" stroke="#35404D"/><text x="164" y="465" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">No submitted applications</text><text x="164" y="494" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Use the saved job context; do not recreate the target or resume.</text><rect x="164" y="523" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="176" y="548" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Browse jobs</text><rect x="912" y="244" width="384" height="170" rx="8" fill="#191F28" stroke="#35404D"/><text x="932" y="275" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">Tracking</text><text x="932" y="304" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Counts live in filters rather than repeated</text><text x="932" y="325" font-family="Inter, Segoe UI, sans-serif" font-size="14" font