ont-weight="400" fill="#ADBACB">submission is recorded.</text><rect x="40" y="425" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="52" y="450" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Continue review</text><rect x="20" y="501" width="350" height="145" rx="8" fill="#191F28" stroke="#35404D"/><text x="40" y="532" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#EEF2F7">No submitted applications</text><text x="40" y="561" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">Use the saved job context; do not</text><text x="40" y="582" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#ADBACB">recreate the target or resume.</text><rect x="40" y="590" width="230" height="40" rx="6" fill="#191F28" stroke="#7D8DA3"/><text x="52" y="615" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#EEF2F7">Browse jobs</text><rect x="0" y="846" width="390" height="74" rx="0" fill="#191F28" stroke="#35404D"/><text x="12.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#ADBACB">Overview</text><text x="90.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#ADBACB">Profile</text><text x="168.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#ADBACB">Jobs</text><text x="246.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#ADBACB">Resumes</text><text x="324.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#AEC7ED">Applications</text><text x="20" y="830" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#ADBACB">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>