<svg xmlns="http://www.w3.org/2000/svg" width="390" height="920" viewBox="0 0 390 920"><title>Application review: proposed light mobile wireframe</title><rect x="0" y="0" width="390" height="920" rx="0" fill="#F5F6F8" stroke="#F5F6F8"/><rect x="0" y="0" width="390" height="64" rx="0" fill="#FFFFFF" stroke="#D4DAE3"/><text x="24" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="650" fill="#18212E">Career Hub</text><text x="315" y="39" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Menu</text><text x="20" y="99" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#536276">Career Hub / Applications</text><text x="20" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#18212E">Application review</text><text x="20" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Confirm this version and the job-specific</text><text x="20" y="191" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">answers.</text><rect x="20" y="211" width="350" height="40" rx="6" fill="#315B93" stroke="#315B93"/><text x="32" y="236" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Review approval</text><rect x="20" y="279" width="350" height="156" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="40" y="310" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Job and selected resume</text><text x="40" y="339" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Frontend Engineer / Synthetic Systems.</text><text x="40" y="360" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Show the exact draft revision, document</text><text x="40" y="381" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">and package binding.</text><rect x="40" y="379" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="52" y="404" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Open Studio</text><rect x="20" y="455" width="350" height="178" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="40" y="486" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Application-specific questions</text><text x="40" y="515" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Reuse profile facts. Ask only for missing</text><text x="40" y="536" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">answers or conflicting values. These</text><text x="40" y="557" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">answers do not rewrite the master.</text><rect x="40" y="577" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="52" y="602" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Review answers</text><rect x="20" y="653" width="350" height="180" rx="8" fill="#FFFFFF" stroke="#D4DAE3"/><text x="40" y="684" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#18212E">Review and approve</text><text x="40" y="713" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">Explicit consent binds the exact package</text><text x="40" y="734" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">and destination. Any later edit needs a</text><text x="40" y="755" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#536276">fresh review.</text><rect x="40" y="777" width="230" height="40" rx="6" fill="#FFFFFF" stroke="#7A8799"/><text x="52" y="802" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#18212E">Review package</text><rect x="0" y="846" width="390" height="74" rx="0" fill="#FFFFFF" stroke="#D4DAE3"/><text x="12.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#536276">Overview</text><text x="90.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#536276">Profile</text><text x="168.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#536276">Jobs</text><text x="246.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#536276">Resumes</text><text x="324.0" y="882" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#315B93">Applications</text><text x="20" y="830" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#536276">PROPOSED WIREFRAME / NOT IMPLEMENTED</text></svg>