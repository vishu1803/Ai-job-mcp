name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Code Quality, Migration & Test Verification
    runs-on: ubuntu-latest
    # Every step carries its own timeout-minutes guard, so a single hung or broken
    # step fails fast and specifically instead of silently consuming the job's
    # budget (an unbounded integration suite previously ran for 4.6h before the
    # job was cancelled). This job-level ceiling is the outer backstop: it sits
    # well above the observed end-to-end time (~10 min on ubuntu-latest) so it can
    # never truncate the test chain, while still bounding a runaway to one hour.
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: career_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d career_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres_ci_password@localhost:5432/career_hub_test
      DATABASE_SSL: 'false'
      DATABASE_POOL_MIN: 0
      DATABASE_POOL_MAX: 3
      DATABASE_STATEMENT_TIMEOUT_MS: 30000
      LOG_LEVEL: warn
      ENCRYPTION_MASTER_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      SESSION_COOKIE_SECRET: 'mock-ci-session-cookie-secret-minimum-32-chars-long'
      AUTH_SECRET: 'mock-ci-auth-secret-minimum-32-chars-long'
      # Required configuration for the GitHub webhook ingress contract (HMAC-SHA256
      # signature verification). Without it the ingress cannot reject unsigned or
      # forged deliveries and the webhook security suites cannot exercise the
      # configured-secret path.
      GITHUB_WEBHOOK_SECRET: 'mock-ci-github-webhook-secret-hmac-sha256'
      CHROME_BIN: /usr/bin/chromium
      # Explicit, non-brittle PDF compilation ceilings. The canonical CI engine is
      # Tectonic (installed below); these ceilings also cover pdflatex and the
      # headless-Chromium fallback so no engine depends on an inline hard-coded
      # 15-second browser timeout.
      TECTONIC_BIN: /usr/local/bin/tectonic
      # CI declares the hermetic TeX engine mandatory. The artifact suite asserts the
      # compiler really reports `compilerUsed: tectonic`, so the toolchain *setup*
      # steps below can stay non-blocking without ever letting PDF compilation
      # degrade silently to the headless-Chromium fallback.
      REQUIRE_TECTONIC_ENGINE: 'true'
      PDF_COMPILE_TECTONIC_TIMEOUT_MS: '180000'
      PDF_COMPILE_PDFLATEX_TIMEOUT_MS: '120000'
      PDF_COMPILE_CHROME_TIMEOUT_MS: '90000'

    steps:
      # Guarding policy for this workflow: the fast, deterministic quality gates
      # below stay blocking (failing them early is cheap and desirable). The
      # toolchain setup steps marked continue-on-error derive their guarantees from
      # the test suites instead, so a download, apt, or relay problem can no longer
      # skip all three verification layers the way it did in runs #162/#163.
      - name: Checkout repository
        uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Setup Node.js runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
        timeout-minutes: 10

      - name: Install dependencies (deterministic)
        run: npm ci
        timeout-minutes: 10

      - name: Verify code formatting (Prettier)
        run: npm run format:check
        timeout-minutes: 5

      - name: Run static analysis (ESLint)
        run: npm run lint
        timeout-minutes: 10

      - name: Run automated dependency vulnerability audit (npm audit)
        run: npm run audit:deps
        timeout-minutes: 5

      - name: Scan repository for secret & credential leaks
        run: npm run scan:secrets
        timeout-minutes: 5

      - name: Validate Drizzle ORM configuration & schema
        run: npm run db:check
        timeout-minutes: 5

      - name: Execute database migrations from scratch
        run: npm run db:migrate
        timeout-minutes: 10

      - name: Seed test database fixtures
        run: npm run db:seed:test
        timeout-minutes: 10

      # Deterministic Linux LaTeX engine. The repository's Windows-only
      # tools/bin/tectonic.exe is never used on Linux; the compiler service
      # resolves TECTONIC_BIN / PATH instead, so PDF compilation is hermetic and
      # never silently falls through to headless Chromium in CI. Non-blocking: the
      # artifact suite fails loudly via REQUIRE_TECTONIC_ENGINE if the engine is
      # absent, so verification still runs and still reports the truth.
      - name: Install Tectonic (deterministic LaTeX engine)
        continue-on-error: true
        timeout-minutes: 10
        env:
          # Pinned to the engine version the document pipeline is validated against.
          TECTONIC_VERSION: '0.15.0'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            -o /tmp/tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/tectonic.tar.gz -C /tmp
          sudo install -m 0755 /tmp/tectonic /usr/local/bin/tectonic
          command -v tectonic
          tectonic --version

      # Pure cache prime, never a correctness gate: the artifact suite compiles real
      # documents regardless, so a relay hiccup here must not be able to skip the
      # verification layers. Non-blocking, with bounded retries for transient CDN
      # failures.
      - name: Warm Tectonic bundle cache (offline-ready formats)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Tectonic does NOT create its --outdir: when the directory is missing
          # it aborts immediately with
          #   error: output directory "<path>" does not exist
          # so the directory has to exist before the first compile. The input is
          # placed inside that directory so the input/output paths cannot drift.
          warmup_dir=/tmp/tectonic-warmup
          mkdir -p "$warmup_dir"
          printf '\\documentclass{article}\\begin{document}warmup\\end{document}\n' \
            > "$warmup_dir/warmup.tex"
          # Prime the shared bundle cache so the PDF QA suites do not pay the
          # first-run bundle download. Bounded retries absorb transient relay/CDN
          # hiccups; because this step is non-blocking, even a persistent failure is
          # surfaced as a warned step instead of skipping the test chain, and the
          # artifact suite independently asserts the engine actually works.
          for attempt in 1 2 3; do
            if tectonic "$warmup_dir/warmup.tex" --outdir "$warmup_dir" --keep-logs; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Tectonic bundle warm-up failed after ${attempt} attempts"
              exit 1
            fi
            echo "Warm-up attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          # Assert the warm-up actually produced a document, so a silently
          # non-compiling cache prime can never pass as success.
          test -f "$warmup_dir/warmup.pdf"
          echo "Tectonic bundle cache warmed: $(tectonic --version)"

      # Chromium is needed only by the PDF observer and as the compiler's last-resort
      # fallback, both of which fail loudly in the suites if it is missing. Making
      # the install non-blocking keeps apt flakiness from skipping verification.
      - name: Install Chromium
        continue-on-error: true
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium
          command -v chromium

      - name: Execute unit test suite
        run: npm run test:unit
        timeout-minutes: 20

      - name: Execute PDF artifact & document QA suite
        run: npm run test:artifacts
        timeout-minutes: 15

      - name: Execute live integration test suite
        run: npm run test:integration
        timeout-minutes: 30
